[package]
name = "sqlx-aip"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Rewrites an AIP List request's filter, order_by and page_token into Postgres SQL fragments, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-aip"
keywords = ["aip", "sqlx", "postgres", "pagination"]
categories = ["database"]

# Denied rather than warned, because several consumers in this ecosystem deny
# pedantic at the workspace level: a lint this crate tolerates is a lint they
# cannot.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# From git, not crates.io: both are unreleased. aip-rs is renamed back to
# `aip`, because that is what the generated code says -- it is published as
# `aip-rs` only because `aip` was taken.
#
# A sibling checkout would work here too and is quicker to iterate against, but
# it makes a standalone clone of this repo unbuildable.
aip = { package = "aip-rs", git = "https://github.com/protoc-contrib/aip-rs" }
sqlx-cel = { git = "https://github.com/sqlx-contrib/sqlx-cel" }
# Only to name `cel::Program` in the public API; the transpiling is sqlx-cel's.
cel = { version = "0.14", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["postgres"] }

[features]
default = ["chrono"]
chrono = ["sqlx-cel/chrono"]
time = ["sqlx-cel/time"]
