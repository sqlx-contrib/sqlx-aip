name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    # tests/postgres.rs skips without a database, and the round-trip it asserts
    # -- that paging a non-unique sort column sees every row exactly once -- is
    # the one thing fragment-level assertions cannot stand in for. Silently
    # skipping it in CI would leave the crate's central claim untested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sqlx_aip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sqlx_aip_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Check Formatting
        run: nix develop --command cargo fmt --check
      - name: Lint
        run: nix develop --command cargo clippy --all-targets
      - name: Run Tests
        run: nix develop --command cargo test
      - name: Check Documentation
        run: nix develop --command cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The date-time backend is behind a Cargo feature, and the combinations do
      # not compile for free: the `cfg` that is right for chrono is a missing
      # arm under time. Sweeping them is what catches that, and it is cheap next
      # to the Nix setup this job has already paid for.
      #
      # The empty set is swept too, as a *negative*: the crate refuses to build
      # without a backend, because a Timestamp cursor value would have nowhere
      # to go. If that `compile_error!` ever stops firing, the mapping in
      # docs/cursor.md has quietly become partial.
      - name: Check Feature Combinations
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for features in "chrono" "time" "chrono,time"; do
              echo "::group::features: [$features]"
              cargo test --no-default-features --features "$features"
              echo "::endgroup::"
            done
            echo "::group::features: [] must not build"
            if cargo check --no-default-features 2>/dev/null; then
              echo "expected --no-default-features to fail: no date-time backend"
              exit 1
            fi
            echo "::endgroup::"
          '
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
  # No `build` job: this is a library crate with no binary, so there is nothing
  # to `nix build` and no asset to attach to the release. The crate itself is
  # the artifact, and it goes to crates.io below.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to Crates.io
        run: nix develop --command cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
