name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Brings up .devcontainer/docker-compose.yml -- including the Postgres
      # tests/postgres.rs runs against -- and tears it down in a post-step even
      # if the job is cancelled. DATABASE_URL is not set here: the shell hook
      # gets it from `devcontainer-env export`, so it is defined once, in
      # devcontainer.json.
      #
      # Nix then runs on the runner itself rather than inside the container.
      # Building the devcontainer anyway is what keeps its definition honest --
      # a broken one fails CI instead of only failing the next contributor.
      - name: Setup Devcontainer
        uses: devcontainer-env/devcontainer-ci@v1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Check Formatting
        run: nix develop --command cargo fmt --check
      - name: Lint
        run: nix develop --command cargo clippy --all-targets --features sqlite,mysql
      - name: Run Tests
        run: nix develop --command cargo test --features sqlite,mysql
      - name: Check Documentation
        run: nix develop --command cargo doc --no-deps --features sqlite,mysql
        env:
          RUSTDOCFLAGS: -D warnings
      # Every driver and date-time backend is behind a Cargo feature, and the
      # combinations do not compile for free: a `cfg` that is right for one is
      # dead code or a missing arm in another. Sweeping them is what catches
      # that, and it is cheap next to the Nix setup this job has already paid
      # for.
      #
      # A driver-less build is swept too, because the dialects are pure text and
      # must stay usable without one -- only `bind_all` needs a driver.
      #
      # And the date-time-less set as a *negative*: the crate refuses to build
      # without a backend, because a Timestamp cursor value would have nowhere
      # to go. If that `compile_error!` ever stops firing, the CursorValue
      # mapping has quietly become partial.
      - name: Check Feature Combinations
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for features in "chrono" "time" "chrono,time" \
                            "chrono,postgres" "time,sqlite" "chrono,mysql" \
                            "chrono,time,postgres,sqlite,mysql"; do
              echo "::group::features: [$features]"
              cargo test --no-default-features --features "$features"
              echo "::endgroup::"
            done
            echo "::group::features: [postgres] must not build"
            if cargo check --no-default-features --features postgres 2>/dev/null; then
              echo "expected a build with no date-time backend to fail"
              exit 1
            fi
            echo "::endgroup::"
          '
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
  # No `build` job: this is a library crate with no binary, so there is nothing
  # to `nix build` and no asset to attach to the release. The crate itself is
  # the artifact, and it goes to crates.io below.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to Crates.io
        run: nix develop --command cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
